name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: igreja
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          APP_RUNTIME_PASSWORD: runtime-test
          APP_MIGRATOR_PASSWORD: migrator-test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d igreja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision database roles and schema
        env:
          PGPASSWORD: postgres
          APP_RUNTIME_PASSWORD: runtime-test
          APP_MIGRATOR_PASSWORD: migrator-test
        run: |
          docker exec -e APP_RUNTIME_PASSWORD -e APP_MIGRATOR_PASSWORD ${{ job.services.postgres.id }} sh /dev/stdin < database/bootstrap/00-roles.sh
          docker cp database/migrations/. ${{ job.services.postgres.id }}:/migrations
          docker exec ${{ job.services.postgres.id }} sh -c "psql -v ON_ERROR_STOP=1 -1 -U postgres -d igreja -f /migrations/001_initial.sql"
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://igreja_runtime:runtime-test@localhost:5434/igreja
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5434/igreja
      - run: pnpm build
