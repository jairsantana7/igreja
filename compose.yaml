name: igreja

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-igreja}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-change-me}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:-runtime-local-change-me}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:-migrator-local-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/bootstrap:/docker-entrypoint-initdb.d:ro
      - ./database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - data

  whatsapp-worker:
    profiles: ["whatsapp"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.whatsapp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://igreja_runtime:${APP_RUNTIME_PASSWORD:-runtime-local-change-me}@postgres:5432/${POSTGRES_DB:-igreja}
      JWT_SECRET: ${JWT_SECRET:-local-only-replace-with-at-least-32-random-characters}
      SESSION_BINDING_SECRET: ${SESSION_BINDING_SECRET:-local-session-binding-replace-with-32-characters}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3100}
      JOB_QUEUE_DRIVER: bullmq
      REDIS_URL: redis://redis:6379
      JOB_QUEUE_NAME: ${JOB_QUEUE_NAME:-igreja-jobs}
      WHATSAPP_QUEUE_NAME: ${WHATSAPP_QUEUE_NAME:-igreja-whatsapp}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WHATSAPP_HISTORY_CHAT_LIMIT: ${WHATSAPP_HISTORY_CHAT_LIMIT:-50}
      WHATSAPP_HISTORY_MESSAGE_LIMIT: ${WHATSAPP_HISTORY_MESSAGE_LIMIT:-50}
      WHATSAPP_WEB_DRIVER: baileys
      CONVERSATION_SESSION_ENCRYPTION_KEY: ${CONVERSATION_SESSION_ENCRYPTION_KEY:-}
      MEDIA_STORAGE_PATH: /app/.data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data
    volumes:
      - ./.data/media:/app/.data/media

volumes:
  postgres-data:
  redis-data:

networks:
  data:
    name: igreja-local-data
